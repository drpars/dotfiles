#:schema https://yazi-rs.github.io/schemas/yazi.json

# Bu dosya TAM KOPYA DEGIL: yalnizca gomulu varsayilandan farkimiz.
# Gerekce ve olculen kurallar keymap.toml'un basinda.
#
# Cikarilan bloklarin tamami gomulu varsayilanla BIREBIR AYNIYDI (olculdu,
# tomllib ile eleman eleman): [preview], [opener], [open], [tasks], [input],
# [confirm], [pick], [which], ve [plugin]'in fetchers/spotters/preloaders/
# previewers listeleri. Tam kopyayi tutmanin bedeli uc kez odendi.
#
# Cikarirken duzelen iki hata (2026-08-24 olcumu):
#  * `[plugin] spotters` icinde `trash/**` MUKERRER duruyordu (index 1 ve 10);
#    varsayilanda bir tane var.
#  * `[plugin] previewers` icinde `trash/**` EKSIKTI; varsayilanda var,
#    yani cop icerigi onizlenemiyordu.
#  * `fetchers` girdileri bayat `id = "mime"` alanini tasiyordu.

[mgr]
# Varsayilan [ "click", "scroll", "drag" ] -- surukleme bilerek kapali.
mouse_events = [ "click", "scroll" ]

# `id` alani BILEREK yok, ve bu asagidaki mime-ext bloklari icin de gecerli:
# eklenti README'leri "Yazi > v26.1.22 ise kaldir" diyor, kurulu surum sarti
# asiyor. Surum `yazi --version` ile sorulur, buraya yazilmaz.
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# mime-ext: MIME turunu file(1) yerine uzanti veritabanindan bulur (hiz).
# Dogruluk odununu init.lua kapatiyor: fallback_file1 = true, yani
# veritabaninda olmayan uzanti file(1)'e duser.
[[plugin.prepend_fetchers]]
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"

# piper: kabuk komutunu onizleyiciye cevirir. Markdown burada glow ile
# render ediliyor; ayni mekanizma ileride csv/tar icin de kullanilabilir.
# $w = onizleme genisligi, $1 = dosya yolu (piper'in kendi degiskenleri).
[[plugin.prepend_previewers]]
url = "*.{md,markdown}"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'
