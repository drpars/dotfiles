#:schema https://yazi-rs.github.io/schemas/keymap.json

# Bu dosya TAM KOPYA DEGIL: yalnizca gomulu varsayilandan farkimiz.
# Varsayilan keymap ikilinin icinde; dokme yontemi NOTLAR.md'de (offset +
# `strings -n 20 /usr/bin/yazi | grep 'on = '`).
#
# NEDEN tam kopya degil: donmus kopya yukari akimla sessizce ayrisiyor ve
# ayrisma "bizim tercihimiz" gibi gorunuyor. Uc kez odendi (`g t` bagsiz
# kalacakti, `trash/**` kuralinin mime'i yoktu, `[opener] trash` eksikti).
#
# OLCULEN KURALLAR (2026-08-24, yazi 26.8.15, izole XDG_CONFIG_HOME + pty):
#  * `prepend_keymap` ayni `on` icin varsayilani GOLGELER -- tek tusta da
#    zincirde de dogrulandi.
#  * Bir varsayilani KALDIRMAK icin `run = []` yazilir.
#    `run = ""` config'i reddettirir ("cannot be empty", yazi hic acilmaz).
#    `noop` diye bir komut YOK -- ikilide hic gecmiyor.
#  * DIKKAT: yazi tanimadigi komut adini SESSIZCE yutar. `run = "quitt"`
#    hatasiz bir OLU TUS uretir -- ne uyari, ne cikis kodu. O yuzden
#    buradaki her satir tek tek surulerek dogrulanir.
#  * `cd` argumaninda `~` ve `$HOME/...` cozulur; tek basina `$VAR` ve
#    `$(...)` COZULMEZ. Makineden bagimsiz hedef icin kabuk uzerinden
#    `shell "ya emit cd ..."` kullanilir (asagida iki ornek).

[mgr]
prepend_keymap = [
	# Navigation
	# smart-enter: dizinse gir, dosyaysa ac. <Right> duz `enter` kaliyor --
	# eklenti bozulursa gezinmenin calisan bir yolu kalir.
	{ on = "l", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },

	# Archive (compress.yazi)
	# Uzanti hedef bicimi belirler: "ad" birakilirsa .zip, "ad.7z" yazilirsa
	# 7z, "ad.tar.zst" yazilirsa tar.zst. Arka uclar kurulu: zip, 7z, tar,
	# gzip, xz, bzip2, zstd, lz4. `.rar` ve `.lha` OLUSTURULAMAZ (ikilileri
	# yok; unrar yalnizca acar).
	{ on = [ "c", "a", "a" ], run = "plugin compress", desc = "Archive selected files" },
	{ on = [ "c", "a", "p" ], run = "plugin compress -p", desc = "Archive selected files (password)" },
	{ on = [ "c", "a", "h" ], run = "plugin compress -ph", desc = "Archive selected files (password + encrypted header)" },
	{ on = [ "c", "a", "l" ], run = "plugin compress -l", desc = "Archive selected files (compression level)" },

	# Goto
	# Varsayilan `g d` = `cd ~/Downloads`; bu makinede o dizin yok
	# (XDG_DOWNLOAD_DIR = ~/Indirilenler). Yol yazmak yerine XDG veritabani
	# sorulur, boylece makine ve locale farki fark etmez.
	# `cd $(...)` yazi tarafindan cozulmedigi icin kabuk uzerinden gidiliyor.
	{ on = [ "g", "d" ], run = 'shell "ya emit cd $(xdg-user-dir DOWNLOAD)"', desc = "Go to the XDG download directory" },
	# Ayni sebeple: duz `cd /run/media/$(whoami)` olculdu ve /run/media'ya
	# iniyordu (bir seviye yukari), cunku $(...) cozulmuyor.
	{ on = [ "g", "m" ], run = 'shell "ya emit cd /run/media/$(whoami)"', desc = "Goto Media directory" },

	# Tabs
	# Tek tuslu `t`: varsayilan `t t`/`t r` zincirlerini kapatir -- olculdu,
	# tek tus zincir onekini beklemeden atesliyor. Bilincli tercih.
	{ on = "t", run = "tab_create --current", desc = "Create a new tab with CWD" },

	# Mount
	{ on = "M", run = "plugin mount", desc = "Mount/Unmount filesystems" },
	# SSHFS -- eklentinin onerdigi "M s" kullanilamadi: "M" tam bir baglama
	# oldugu icin onu onek yapan bir akort tanimlanamiyor. Serbest tek tus: F.
	{ on = "F", run = "plugin sshfs -- menu", desc = "SSHFS: uzak sunucu bagla/coz" },
	# Klasor/secim boyutu (what-size). Eklentinin onerdigi "." oneki
	# kullanilmadi; "." varsayilanda gizli dosya anahtari. Buyuk harf o
	# yuzden linemode ailesine bitisik secildi: "m s" satirin ne gosterdigini
	# degistirir, "m S" gercek boyutu hesaplar. Buyuk/kucuk ciftinin emsali ayni
	# dosyada var ("," ailesi).
	{ on = [ "m", "S" ], run = "plugin what-size", desc = "Secimin/klasorun boyutunu hesapla" },
	# Open shell here
	{ on = "!", run = 'shell "zsh" --block', desc = "Open shell here (Blocking)" },
	# Toggle pane
	{ on = "T", run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
]

[help]
prepend_keymap = [
	# Filtering
	{ on = "f", run = "filter", desc = "Filter help items" },
]
