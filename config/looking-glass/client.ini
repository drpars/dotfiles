; Looking Glass istemci ayarlari -- hedef: ~/.config/looking-glass/client.ini
;
; Arama sirasi (config.c:571-620, ucu de UST USTE biner, hicbiri digerini
; elemez): /etc/looking-glass-client.ini -> <pw_dir>/.looking-glass-client.ini
; -> $XDG_CONFIG_HOME/looking-glass/client.ini. Ilk ikisi bu makinede yok.
; Dosyanin adi client.ini'dir, looking-glass-client.ini DEGIL.
;
; SOZDIZIMI TUZAKLARI -- B7 kaynagindan okundu (common/src/option.c). Ilk
; ucunde istemci HIC BASLAMAZ, sessizce yanlis calismaz:
;   - Bolum basligindan ONCE gelen anahtar dosyayi dusurur (option_load false
;     -> config_load false -> main.c:1895 return -1).
;   - Bolum basligi satirinin sonundaki tek bir BOSLUK bile "Syntax error,
;     expected new line" verir (kontrol c<32||c>126, bosluk 32).
;   - Yorum karakteri YALNIZ ';' ve YALNIZ satirin ILK karakteri olarak.
;     Girintili ';' yorum sayilmaz, '#' hic ele alinmaz -- ikisi de anahtar
;     adina girer.
;   - Taninmayan anahtar yalnizca "Ignored unknown option" uyarisi verir,
;     calismayi durdurmaz (yani yazim hatasi sessizce etkisiz kalir).
;
; BURAYA fullScreen / noScreensaver YAZILMAZ, bilerek. Onlari config/scripts/win
; "win:fullScreen=..." pozisyonel bicimiyle ACIKCA atiyor ve tek otorite odur.
; Sebep yalnizca tekrar degil: LG'nin kisa bool bayraklari (-F, -S) deger
; atamaz, mevcut degeri TERSINE CEVIRIR (option.c:414-419). Bu dosyaya
; fullScreen=yes yazilip betikte -F kalsaydi tam ekran KAPANIRDI.

[input]
; Kacis tusu. Yakalama modundan cikis ve (basili tutunca, helpMenuDelay=200ms)
; yardim menusu bu tusla acilir.
;
; LG'nin varsayilani 70 = KEY_SCROLLLOCK. Bu klavyede (ROG Strix G513RM) Scroll
; Lock FIZIKSEL OLARAK YOK: iki ayri turda tusa basilarak olculdu, kod 70 hic
; dusmedi. Varsayilan birakilsaydi yakalama modundan cikis ve overlay menusu
; erisilemez kalirdi -- gunluk kullanim etkilenmez (spice:input yakalama
; olmadan da geciriyor), kaybolan raw-mouse yakalamasi ve ekran ustu menu.
;
; Insert secildi cunku uc olcum birden onu gosterdi: (a) bu klavyede var
; (kod 110, tusa basilarak olculdu), (b) Hyprland'de HICBIR baglamasi yok --
; ta.sinacak baglama yok, (c) LG'nin kabul ettigi ad tablosunda var (kb.c
; linux_to_str), yani sayi yerine adiyla yazilabiliyor.
;
; KABUL EDILEN BEDEL: kacis tusu misafire HIC iletilmiyor (app.c:318-324;
; keyDown hic kurulmadigi icin birakma olayi da dusuyor). Yani Windows
; tarafinda Insert kaybedilir -- Shift+Insert yapistirma ve editorlerde
; uzerine-yazma kipi. Bu bir feragat, secim degil: hangi tus secilirse
; misafirde o kaybolur. Scroll Lock'un LG varsayilani olmasinin sebebi de
; Windows'ta pratik karsiliginin olmamasiydi.
;
; Elenen adaylar ve neden: PrtSc/KEY_SYSRQ (99) var ama uc hyprshot baglamasi
; tasinmaliydi; ROG/Armoury (KEY_PROG1) ve mikrofon-sus (KEY_MICMUTE) zaten
; Hyprland'de bagli -- LG klavyeyi yalnizca yakalama modundayken grab ettigi
; icin moda GIRERKEN tus compositor'de tukenir ve LG'ye hic ulasmaz; Pause,
; Menu/Compose ve F13-F15 bu klavyede hic uretilmiyor (olculdu).
escapeKey=KEY_INSERT
