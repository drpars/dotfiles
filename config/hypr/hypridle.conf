general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = ~/.config/scripts/razer stop; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on; ~/.config/scripts/razer start &
}

# razer ve rgbprofile, cihazi olmayan makinede sessizce cikar (bkz. betikler);
# bu yuzden bu dosya iki makinede de aynidir.
#
# brightnessctl BUNU KENDILIGINDEN YAPMIYOR, -c backlight onun icin: cihaz ve
# sinif verilmezse backlight sinifi BOSKEN durmuyor, bir sonraki sinifa gecip
# led seciyor. Olculdu panthera'da (2026-08-31, brightnessctl 0.5.1-3), ddcci
# kurulu DEGILKEN: `brightnessctl -m` -> "phy0-led,leds,1,100%,1", Wi-Fi LED'i, ve
# max=1 oldugu icin "set 10%" onu SONDURUYORDU. Sinif sabitlenince bos hal
# kesin: stdout bos, rc=1, mesaj stderr'de, hicbir cihaza dokunulmuyor -- -s,
# set ve -r icin ayri ayri olculdu.
listener {
    timeout = 300
    on-timeout = brightnessctl -c backlight -s set 10%; ~/.config/scripts/rgbprofile pars-off
    on-resume = brightnessctl -c backlight -r; ~/.config/scripts/rgbprofile pars-white
}

listener {
    timeout = 450
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on; brightnessctl -c backlight -r
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
