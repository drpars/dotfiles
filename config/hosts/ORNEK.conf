# =======================================================
# ÖRNEK / İSKELET — bu dosya hiçbir makinede yüklenmez
# =======================================================
# Yeni bir makineye geçerken kopyalanacak şablon. Yüklenmemesinin sebebi adı:
# yapılandırma DMI board_name'den türetilen ada göre aranıyor ve hiçbir anakart
# "ORNEK" değil. Bu yüzden buradaki değerler serbestçe örnek olabilir.
#
# Kendi dosyanı aç:
#
#     cd ~/.dotfiles/config/hosts
#     cp ORNEK.conf "$(hostfact --board).conf"
#
# `hostfact --board`, board_name'i dosya adı dostu hale getirir: güvensiz
# karakterler _, ardışıklar toplanır, uçlar kırpılır. MSI "MEG Z490 UNIFY
# (MS-7C71)" diyor → MEG_Z490_UNIFY_MS-7C71. Aynı türetim iki yerde yazılı ve
# senkron tutuluyor: config/scripts/hostfact ve
# config/hypr/config/helpers.lua (board_id).
#
# Bu dosyayı iki taraf da okur — Hyprland'in Lua yapılandırması (helpers.lua,
# `_G.host` tablosu) ve kabuk betikleri (`hostfact <KEY>`). Makineye özgü
# olgular için TEK gerçek kaynak burasıdır.
#
# Biçim: KEY="value", her satırda bir tane, yorumlar #. Dosya `source`
# EDİLMİYOR (iki taraf da kendi ayrıştırıyor), yani içine sızmış bir komut
# çalışmaz.
#
# Buraya YALNIZCA çalışma anında sorulamayan olgular yazılır. "Araç kurulu mu"
# türünden her şey has()/exists() ile çözülür — kimlik değil yetenek sorulur.
#
# Aşağıdaki anahtarların hepsi yorumlu: kopyalayıp hiç düzenlemezsen makine
# nötr varsayılanlarda kalır, hiçbir şey kırılmaz. Yalnızca bu makinede
# gerçekten farklı olanı aç ve doldur. Dolu örnekler için yan dosyalara bak:
# G513RM.conf (hibrit GPU'lu dizüstü), MEG_Z490_UNIFY_MS-7C71.conf (masaüstü).


# --- Monitör ---
# Bunlar `hl.monitor(host.monitor)` ile Hyprland'e geçiyor (monitors.lua).
# Yapılandırma yüklenirken monitör henüz yok, bu yüzden sorulamıyor.

# Konektör adı ("DP-1", "eDP-1") ya da EDID açıklaması ("desc:BOE 0x0A07").
# İki grafik kartı olan makinelerde konektör NUMARASI oturumdan oturuma
# değişebiliyor (eDP-1 / eDP-2); orada desc: kullan, açıklama numaralamadan
# bağımsızdır. Varsayılan: "" (boş = tüm çıkışlar).
#MONITOR_OUTPUT=""

# Varsayılan: "preferred" (monitörün bildirdiği mod).
#MONITOR_MODE="2560x1440@165"

# Varsayılan: "auto".
#MONITOR_POSITION="0x0"

# Sayı ya da "auto". Varsayılan: "auto".
#MONITOR_SCALE="1"

# 10-bit panellerde "10". Varsayılan: yazılmazsa Hyprland'e hiç verilmez.
#MONITOR_BITDEPTH="10"

# Renk yönetimi: "wide", "hdr" vb. Varsayılan: yazılmazsa hiç verilmez.
#MONITOR_CM="wide"


# --- Grafik ---
# environment.lua'da NVIDIA'ya özgü ortam değişkenlerini (GBM backend vb.)
# açar. "nvidia modülü yüklü mü" diye sormak AYIRT ETMİYOR: hibrit dizüstünde
# de yüklü. Olgu şu ki her şeyi nvidia-drm'e zorlamak yalnızca tek kartlı
# makinede doğru; hibrit kurulumda iGPU'yu devre dışı bırakır.
# Varsayılan: "false".
#NVIDIA_ENV="true"

# --- RGB çevre birimleri ---
# autostart.lua'da OpenRGB profilini, `rgbprofile` betiğinde Razer/OpenRGB
# çağrılarını koşullar. openrgb ikilisi her iki makinede de kurulu olduğu için
# yetenek testi ayırt etmezdi — eksik olan CİHAZLARIN kendisi.
# Varsayılan: "false".
#RGB_DEVICES="true"

# --- Klavye ---
# input.lua'daki kb_layout. Tuş takımının üstünde ne basılı olduğu fiziksel bir
# olgu, yazılımdan sorulamaz. İlk yazılan öncelikli.
# Varsayılan: "us,tr".
#KB_LAYOUT="tr,us"
