# =======================================================
# MAKİNE: ASUS ROG Strix G513RM (dizüstü, PANTHERA-DR)
# =======================================================
# DMI board_name = "G513RM". Bu dosyayı hem Hyprland'in Lua yapılandırması
# (config/hypr/config/helpers.lua) hem de kabuk betikleri (scripts/hostfact)
# okur — makineye özgü olgular için TEK gerçek kaynak burasıdır.
#
# Biçim: KEY="value", her satırda bir tane, yorumlar #. Dosya `source`
# EDİLMİYOR (iki taraf da kendi ayrıştırıyor), yani içine sızmış bir komut
# çalışmaz. Tırnak okunabilirlik ve boşluklu değerler için.
#
# Buraya YALNIZCA yeteneğe sorulamayan olgular yazılır. "Araç kurulu mu"
# türünden her şey has()/exists() ile çözülür — bkz. keybindings.lua.

# --- Dahili panel (BOE 0x0A07) ---
# Konektör ADIYLA eşleşmiyoruz. Bu makinede iki kart var — biri AMD 680M
# (iGPU), biri RTX 3060 (dGPU) — ve İKİSİ DE bir eDP konektörü sunuyor. Panel
# bu yüzden oturuma göre eDP-1 ya da eDP-2 olarak numaralanabiliyor;
# 2026-07-30'da tam olarak bu oldu.
#
# Kartların card1/card2 numaraları buraya BİLEREK yazılmıyor: aynı kararsızlık
# onlar için de geçerli. Numarayı sabit sayan bir yorum bir kez yazıldı ve
# ters çıktı — ölçüm hangi kartın card1 olduğunu bu dosyanın söylediğinin
# tersine gösterdi. Açıklama EDID'den gelir, her iki numaralamadan da
# bağımsızdır; doğrulamak gerekirse /dev/dri/by-path okunur.
MONITOR_OUTPUT="desc:BOE 0x0A07"
MONITOR_MODE="2560x1440@165"
MONITOR_POSITION="0x0"
MONITOR_SCALE="1"
MONITOR_BITDEPTH="10"
MONITOR_CM="wide"

# --- Grafik ---
# Hibrit: Radeon 680M (iGPU) + RTX 3060 Mobile (dGPU), nvidia modülü yüklü.
# "nvidia var mı" diye sormak ayırt etmiyor; olgu şu ki her şeyi nvidia-drm'e
# zorlamak hibrit kurulumda doğru değil.
NVIDIA_ENV="false"

# --- RGB çevre birimleri ---
# OpenRGB profilleri (pars-white/pars-off) ve Razer cihazları masaüstünde.
# openrgb ikilisi burada da kurulu, yani yetenek testi ayırt etmezdi —
# eksik olan cihazların kendisi.
RGB_DEVICES="false"

# --- Klavye ---
# Dizüstünün tuş takımı Türkçe basılı. Fiziksel olgu, yazılımdan sorulamaz.
KB_LAYOUT="tr,us"
