# =======================================================
# MAKİNE: MSI MEG Z490 UNIFY (masaüstü, PANTHERA-ARCH)
# =======================================================
# DMI board_name = "MEG Z490 UNIFY (MS-7C71)". Boşluk ve parantez dosya adına
# çevrilirken sadeleşiyor → MEG_Z490_UNIFY_MS-7C71.conf
#
# Bu dosyayı hem Hyprland'in Lua yapılandırması hem de kabuk betikleri okur.
# Biçim ve kurallar için G513RM.conf'un başlığına bak.

# --- Monitör (MSI MAG274QRF-QD) ---
# Tek kart olduğu için konektör adı sabit; desc: gerekmiyor.
MONITOR_OUTPUT="DP-1"
MONITOR_MODE="2560x1440@120"
MONITOR_POSITION="0x0"
MONITOR_SCALE="1"
MONITOR_BITDEPTH="10"
MONITOR_CM="wide"

# --- Grafik ---
# Tek GPU: RTX 3070, amdgpu yok. Hibrit olmadığı için her şeyi nvidia-drm'e
# yönlendirmek burada doğru.
NVIDIA_ENV="true"

# --- RGB çevre birimleri ---
# OpenRGB profilleri ve openrazer cihazları (klavye + fare) burada.
RGB_DEVICES="true"

# --- Klavye ---
# US klavye.
KB_LAYOUT="us,tr"
